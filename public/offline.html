<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0d0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>The Retreat Collection — Offline</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #0e0d0c;
    --gold: #c8a24c;
    --gold-light: #e3c682;
    --white-soft: rgba(255, 255, 255, .68);
  }

  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100svh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 28px);
    background:
      radial-gradient(circle at 50% 22%, rgba(227, 198, 130, .12), transparent 32%),
      linear-gradient(180deg, #15130f, var(--ink));
    color: var(--white-soft);
    font-family: Jost, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-align: center;
  }

  main {
    width: min(440px, 100%);
  }

  img {
    width: min(210px, 62vw);
    height: auto;
    opacity: .9;
  }

  .mark {
    position: relative;
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    margin: 30px auto 0;
    border: 1px solid rgba(227, 198, 130, .42);
    border-radius: 999px;
  }

  .mark::before {
    content: "";
    position: absolute;
    inset: 11px;
    border: 1px solid rgba(227, 198, 130, .18);
    border-radius: inherit;
  }

  .mark svg {
    position: absolute;
    bottom: -12px;
    width: 24px;
    height: 24px;
    color: var(--gold-light);
    transform: rotate(90deg);
  }

  h1 {
    margin: 34px 0 0;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 12vw, 56px);
    font-weight: 300;
    line-height: .94;
  }

  p {
    max-width: 330px;
    margin: 22px auto 0;
    font-size: 13px;
    font-weight: 300;
    line-height: 1.8;
  }

  .status {
    margin-top: 28px;
    color: var(--gold-light);
    font-size: 9px;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 30px;
  }

  a {
    border: 1px solid rgba(227, 198, 130, .34);
    padding: 11px 14px;
    color: var(--gold-light);
    font-size: 9px;
    letter-spacing: .2em;
    text-decoration: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <main>
    <img src="/media/brand/retreat-collection-logo-crop-580.png" width="580" height="220" alt="The Retreat Collection" />
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path fill="currentColor" d="M21,16V14L13,9V3.5C13,2.67 12.33,2 11.5,2C10.67,2 10,2.67 10,3.5V9L2,14V16L10,13.5V19L7.5,20.5V22L11.5,21L15.5,22V20.5L13,19V13.5L21,16Z" />
      </svg>
    </div>
    <h1>Route paused</h1>
    <p>The full journey needs a connection for films and live pages. Your installed app shell is ready; reconnect and continue from the route.</p>
    <div class="status">Offline mode</div>
    <nav aria-label="Cached routes">
      <a href="/">Main route</a>
      <a href="/asia/">Asia</a>
      <a href="/asia/maldives/">Maldives</a>
    </nav>
  </main>
</body>
</html>
