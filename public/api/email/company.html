<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>New enquiry</title></head>
<body style="margin:0;padding:24px;background:#f3efe7;font-family:Arial,Helvetica,sans-serif;color:#16243c;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;margin:0 auto;background:#ffffff;border:1px solid #e3d3a8;border-radius:10px;">
  <tr><td style="padding:22px 26px;border-bottom:1px solid #eee6d2;">
    <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8f7231;">New enquiry · {{source}}</div>
    <div style="font-family:Georgia,serif;font-size:24px;padding-top:6px;">{{name}}</div>
  </td></tr>
  <tr><td style="padding:20px 26px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-size:14px;line-height:1.6;">
      <tr><td width="120" style="color:#7c8594;padding:5px 0;" valign="top">Email</td><td style="padding:5px 0;"><a href="mailto:{{email}}" style="color:#16243c;">{{email}}</a></td></tr>
      <tr><td style="color:#7c8594;padding:5px 0;" valign="top">Route</td><td style="padding:5px 0;">{{route}}</td></tr>
      <tr><td style="color:#7c8594;padding:5px 0;" valign="top">Language</td><td style="padding:5px 0;">{{language}}</td></tr>
      <tr><td style="color:#7c8594;padding:5px 0;" valign="top">Page</td><td style="padding:5px 0;">{{page}}</td></tr>
      <tr><td style="color:#7c8594;padding:5px 0;" valign="top">Came from</td><td style="padding:5px 0;">{{lead_source}} · first page {{lead_landing}}</td></tr>
      <tr><td style="color:#7c8594;padding:5px 0;" valign="top">Received</td><td style="padding:5px 0;">{{date}} · {{flight}}</td></tr>
    </table>
    <div style="margin-top:16px;padding:16px 18px;background:#faf8f4;border-left:3px solid #c8a24c;font-family:Georgia,serif;font-size:16px;line-height:1.65;white-space:pre-line;">{{message}}</div>
    <div style="padding-top:18px;font-size:13px;color:#7c8594;">Reply to this email to answer {{name}} directly.</div>
  </td></tr>
</table>
</body></html>
