# Deploys, driven entirely from GitHub:
#
#   REPLICA — automatic. Every push to the `replica` branch builds (with
#   the noindex robots guard) and FTPs to the placeholder
#   (*.hostingersite.com) site. Nothing else auto-deploys anywhere.
#
#   PROD — manual button only. Actions tab -> "Deploy" -> "Run workflow",
#   pick the branch to release (default: replica), press the green button.
#   That's the only way production ever updates.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   REPLICA_FTP_HOST / REPLICA_FTP_USER / REPLICA_FTP_PASS
#   PROD_FTP_HOST    / PROD_FTP_USER    / PROD_FTP_PASS
# Each site's FTP credentials live in hPanel -> that website -> Files ->
# FTP Accounts.
name: Deploy

on:
  push:
    branches: [replica]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  replica:
    if: github.event_name == 'push'
    name: Replica (auto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build with noindex robots guard
        run: npm run build:replica

      # hPanel's copy button includes the "ftp://" prefix — strip any
      # protocol/trailing slashes so a verbatim paste still connects
      - name: Sanitize FTP host
        id: ftp
        run: echo "host=$(printf '%s' '${{ secrets.REPLICA_FTP_HOST }}' | sed -E 's#^[a-zA-Z]+://##; s#/+$##')" >> "$GITHUB_OUTPUT"

      # NOTE: the account-level FTP user's root is /home/u.../, NOT the
      # site's docroot — Hostinger serves this website from
      # domains/<site>/public_html. A bare "public_html/" would create a
      # stray unused folder at the FTP root (learned the hard way).
      - name: Diagnose FTP layout (temporary)
        run: |
          H="${{ steps.ftp.outputs.host }}"
          U="${{ secrets.REPLICA_FTP_USER }}"
          P="${{ secrets.REPLICA_FTP_PASS }}"
          echo "== FTP root =="
          curl -s --user "$U:$P" "ftp://$H/" --list-only || true
          echo "== /domains/ =="
          curl -s --user "$U:$P" "ftp://$H/domains/" --list-only || true
          echo "== /public_html/ (from first attempt) =="
          curl -s --user "$U:$P" "ftp://$H/public_html/" --list-only | head -5 || true
          echo "== /domains/khaki-deer-133961.hostingersite.com/ =="
          curl -s --user "$U:$P" "ftp://$H/domains/khaki-deer-133961.hostingersite.com/" --list-only || true

      - name: Deploy to replica site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.REPLICA_FTP_USER }}
          password: ${{ secrets.REPLICA_FTP_PASS }}
          local-dir: dist/
          server-dir: domains/khaki-deer-133961.hostingersite.com/public_html/

  prod:
    if: github.event_name == 'workflow_dispatch'
    name: Production (manual button)
    runs-on: ubuntu-latest
    # Optional hardening later: create a "production" environment in repo
    # Settings -> Environments and require a reviewer — the button then
    # asks for an approval click before this job runs.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Sanitize FTP host
        id: ftp
        run: echo "host=$(printf '%s' '${{ secrets.PROD_FTP_HOST }}' | sed -E 's#^[a-zA-Z]+://##; s#/+$##')" >> "$GITHUB_OUTPUT"

      # PROD_SERVER_DIR: set this repo VARIABLE (Settings -> Secrets and
      # variables -> Actions -> Variables) to the prod site's docroot,
      # e.g. domains/clientdomain.com/public_html/
      - name: Deploy to production site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.PROD_FTP_USER }}
          password: ${{ secrets.PROD_FTP_PASS }}
          local-dir: dist/
          server-dir: ${{ vars.PROD_SERVER_DIR || 'public_html/' }}
